[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-position-detector"
version = "0.1.0"
description = "Computer vision tool designed to detect chessboards and analyze piece positions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "opencv-python",
    "tensorflow",
    "pdf2image",
    "Pillow",
    "tqdm",
    "moviepy",
]

[project.scripts]
chess-position-detector = "chess_detector.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["chess_detector"]

[tool.setuptools.package-data]
chess_detector = ["*.keras", "*.txt"]
